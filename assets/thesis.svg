<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="What Axylith is">
  <defs>
    <linearGradient id="bg-th" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0e10"/>
      <stop offset="100%" stop-color="#13151a"/>
    </linearGradient>
    <linearGradient id="acc-th" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c89858"/>
      <stop offset="100%" stop-color="#b88848"/>
    </linearGradient>
    <pattern id="grid-th" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2126" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="url(#bg-th)" rx="6"/>
  <rect width="900" height="240" fill="url(#grid-th)" opacity="0.4"/>

  <text x="30" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#5a5249" letter-spacing="2">
    THE THESIS
  </text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#2a2d34" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <text x="30" y="80" fill="#e8dcc8" font-size="22" font-weight="500" letter-spacing="-0.5">
      One binary for research work.
    </text>

    <text x="30" y="118" fill="#a89878" font-size="13" letter-spacing="0">
      Researchers juggle Jupyter, MATLAB, Obsidian, and a dozen other tools that
    </text>
    <text x="30" y="136" fill="#a89878" font-size="13" letter-spacing="0">
      don't talk to each other. Prose lives somewhere. Code lives somewhere else.
    </text>
    <text x="30" y="154" fill="#a89878" font-size="13" letter-spacing="0">
      Data lives in a third place. Sharing context between them means copy-paste,
    </text>
    <text x="30" y="172" fill="#a89878" font-size="13" letter-spacing="0">
      screenshots, and lost reasoning.
    </text>

    <text x="30" y="208" fill="#c89858" font-size="13" font-weight="500">
      Axylith unifies them. Prose, code, data, and 3D geometry in one native binary,
    </text>
    <text x="30" y="226" fill="#c89858" font-size="13" font-weight="500">
      with an AI layer that can reason across all of them.
    </text>
  </g>
</svg>
