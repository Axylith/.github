<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Axylith">
  <defs>
    <linearGradient id="bg-org" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="acc-org" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c89858"/>
      <stop offset="50%" stop-color="#d4a468"/>
      <stop offset="100%" stop-color="#b88848"/>
    </linearGradient>
    <linearGradient id="acc-fade-org" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c89858" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c89858" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c89858" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-org" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow-org" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid-org" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a1c20" stroke-width="0.5"/>
    </pattern>
    <pattern id="dot-org" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1" fill="#1f2126"/>
    </pattern>
  </defs>

  <rect width="900" height="300" fill="url(#bg-org)"/>
  <rect width="900" height="300" fill="url(#dot-org)" opacity="0.7"/>
  <rect width="900" height="300" fill="url(#grid-org)" opacity="0.3"/>

  <rect x="0" y="0" width="900" height="1" fill="url(#acc-fade-org)"/>
  <rect x="0" y="299" width="900" height="1" fill="url(#acc-fade-org)"/>

  <!-- Top tag line -->
  <text x="450" y="56" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="11" fill="#5a5249" letter-spacing="4" text-anchor="middle">
    A · X · Y · L · I · T · H
  </text>

  <!-- Massive wordmark, centered -->
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace">
    <text x="450" y="155" fill="#e8dcc8" font-size="84" font-weight="500" letter-spacing="-2" text-anchor="middle" filter="url(#soft-glow-org)">
      axylith
    </text>

    <!-- Cursor at end of word -->
    <rect x="673" y="103" width="14" height="68" fill="url(#acc-org)" filter="url(#glow-org)" opacity="0.92">
      <animate attributeName="opacity" values="0.92;0.92;0.0;0.0;0.92" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Tagline -->
    <text x="450" y="194" fill="#a89878" font-size="18" font-weight="400" letter-spacing="0" text-anchor="middle">
      research environments, built native
    </text>

    <!-- Status divider -->
    <line x1="350" y1="222" x2="550" y2="222" stroke="#2a2d34" stroke-width="1"/>

    <!-- Status strip -->
    <text x="450" y="244" font-size="11" fill="#5a5249" letter-spacing="2" text-anchor="middle">
      <tspan fill="url(#acc-org)" opacity="0.8">●</tspan>
      <tspan dx="8">PRE-V1</tspan>
      <tspan dx="14">·</tspan>
      <tspan dx="14">CALGARY · CANADA</tspan>
      <tspan dx="14">·</tspan>
      <tspan dx="14">2026</tspan>
    </text>

    <text x="450" y="270" font-size="10" fill="#3a3d44" letter-spacing="1.5" text-anchor="middle">
      C++20 · VULKAN 1.3 · CUSTOM FORMAT · AGPL V3 / COMMERCIAL
    </text>
  </g>

  <!-- Side accent bars -->
  <rect x="0" y="60" width="3" height="180" fill="url(#acc-org)" opacity="0.3"/>
  <rect x="897" y="60" width="3" height="180" fill="url(#acc-org)" opacity="0.3"/>
</svg>
