<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Axylith projects">
  <defs>
    <linearGradient id="bg-pr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0e10"/>
      <stop offset="100%" stop-color="#13151a"/>
    </linearGradient>
    <linearGradient id="acc-pr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c89858"/>
      <stop offset="100%" stop-color="#b88848"/>
    </linearGradient>
    <pattern id="grid-pr" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2126" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="280" fill="url(#bg-pr)" rx="6"/>
  <rect width="900" height="280" fill="url(#grid-pr)" opacity="0.4"/>

  <text x="30" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#5a5249" letter-spacing="2">
    REPOSITORIES
  </text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#2a2d34" stroke-width="1"/>

  <g font-family="JetBrains Mono, monospace">
    <!-- Repo 1: axle -->
    <g transform="translate(30, 60)">
      <rect width="395" height="80" rx="4" fill="#16181c" stroke="url(#acc-pr)" stroke-width="1"/>
      <text x="16" y="22" font-size="13" fill="#e8dcc8" font-weight="500">axle</text>
      <text x="64" y="22" font-size="9" fill="#c89858" letter-spacing="1.5">● ACTIVE</text>
      <text x="16" y="42" font-size="10" fill="#8b8275">The editor. Native binary, C++20, Vulkan 1.3.</text>
      <text x="16" y="58" font-size="10" fill="#5a5249">github.com/Axylith/axle</text>
      <text x="16" y="72" font-size="9" fill="#5a5249" letter-spacing="1">AGPL V3 · COMMERCIAL DUAL-LICENSE</text>
    </g>

    <!-- Repo 2: bots -->
    <g transform="translate(445, 60)">
      <rect width="395" height="80" rx="4" fill="#16181c" stroke="#3a3d44" stroke-width="1"/>
      <text x="16" y="22" font-size="13" fill="#a89878" font-weight="500">bots</text>
      <text x="64" y="22" font-size="9" fill="#5a5249" letter-spacing="1.5">○ PLANNED</text>
      <text x="16" y="42" font-size="10" fill="#8b8275">Maintainer automation toolkit. Action + hosted app.</text>
      <text x="16" y="58" font-size="10" fill="#5a5249">github.com/Axylith/bots</text>
      <text x="16" y="72" font-size="9" fill="#5a5249" letter-spacing="1">APACHE 2.0</text>
    </g>

    <!-- Repo 3: physics (placeholder) -->
    <g transform="translate(30, 150)">
      <rect width="395" height="80" rx="4" fill="#16181c" stroke="#3a3d44" stroke-width="1"/>
      <text x="16" y="22" font-size="13" fill="#a89878" font-weight="500">physics</text>
      <text x="80" y="22" font-size="9" fill="#5a5249" letter-spacing="1.5">○ PLANNED</text>
      <text x="16" y="42" font-size="10" fill="#8b8275">Computational physics engine for the notebook layer.</text>
      <text x="16" y="58" font-size="10" fill="#5a5249">github.com/Axylith/physics</text>
      <text x="16" y="72" font-size="9" fill="#5a5249" letter-spacing="1">APACHE 2.0</text>
    </g>

    <!-- Repo 4: ai -->
    <g transform="translate(445, 150)">
      <rect width="395" height="80" rx="4" fill="#16181c" stroke="#3a3d44" stroke-width="1"/>
      <text x="16" y="22" font-size="13" fill="#a89878" font-weight="500">ai</text>
      <text x="56" y="22" font-size="9" fill="#5a5249" letter-spacing="1.5">○ RESEARCH</text>
      <text x="16" y="42" font-size="10" fill="#8b8275">Inference engine. Local-first, custom compiled path.</text>
      <text x="16" y="58" font-size="10" fill="#5a5249">github.com/Axylith/ai (closed)</text>
      <text x="16" y="72" font-size="9" fill="#5a5249" letter-spacing="1">PROPRIETARY</text>
    </g>
  </g>

  <text x="450" y="262" font-family="JetBrains Mono, monospace" font-size="9" fill="#3a3d44" text-anchor="middle" letter-spacing="1">
    OPEN-SOURCE FOUNDATION · COMMERCIAL EXTENSIONS · NEVER GATE-KEPT BASICS
  </text>
</svg>
